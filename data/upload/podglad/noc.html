<h1>Cała noc 2/3 sierpnia, co godzinę — kamera Śmietnik</h1>
<div class="box">Szukamy <b>Opla Insignii kombi, ustawionego tyłem</b>.<br>
Klatki co godzinę, od 20:14 wieczorem do 04:14 nad ranem.<br><br>
Powiedz, <b>na której godzinie auto już stoi</b> i <b>w którym miejscu kadru</b> —
wtedy przestawię obszar szukania na nie i przemielę noc jeszcze raz.</div>
