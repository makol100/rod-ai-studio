<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spacer 360 — próba</title>
<link rel="stylesheet" href="/static/spacer/pannellum.css">
<script src="/static/spacer/pannellum.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000}
  #panorama{width:100%;height:100%}
</style>
</head>
<body>
<div id="panorama"></div>
<script>
pannellum.viewer('panorama', {
  default: { firstScene: 'parking', autoLoad: true, sceneFadeDuration: 900,
             autoRotate: -3, autoRotateInactivityDelay: 6000, hfov: 100 },
  scenes: {
    parking: {
      title: 'Parking',
      type: 'equirectangular',
      panorama: '/static/spacer/parking.jpg',
      hotSpots: [
        { pitch: -4, yaw: 118, type: 'scene', text: 'Przejdź na plac zabaw ➜', sceneId: 'plac', targetYaw: 95, targetPitch: 0 }
      ]
    },
    plac: {
      title: 'Plac zabaw',
      type: 'equirectangular',
      panorama: '/static/spacer/plac.jpg',
      hotSpots: [
        { pitch: -4, yaw: 95, type: 'scene', text: '➜ Wróć na parking', sceneId: 'parking', targetYaw: 118, targetPitch: 0 }
      ]
    }
  }
});
</script>
</body>
</html>
