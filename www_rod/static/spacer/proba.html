<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spacer 360 — próba</title>
<link rel="stylesheet" href="/static/spacer/pannellum.css">
<style>
  html,body{margin:0;height:100%;background:#000}
  #panorama{width:100%;height:100%}
  div.strzalka{width:120px;height:120px;margin-left:-60px;margin-top:-60px;
    background:rgba(183,225,195,.92);border:3px solid #fff;border-radius:50%;
    box-shadow:0 2px 12px rgba(0,0,0,.55)}
  div.strzalka::after{content:'\27A4';color:#1b5e20;font-size:68px;line-height:114px;
    display:block;text-align:center}
  #ladowanie{position:fixed;inset:0;background:#101810;color:#eaf5ea;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;transition:opacity .5s}
  #ladowanie h1{font-size:1.15rem;font-weight:600;margin:0 0 18px}
  #pasek{width:min(74vw,420px);height:14px;background:#28402c;border-radius:9px;overflow:hidden}
  #pasek-w{height:100%;width:0%;background:linear-gradient(90deg,#7cc98f,#b7e1c3);border-radius:9px;transition:width .2s}
  #procent{margin-top:12px;font-size:1rem;color:#b7e1c3}
</style>
</head>
<body>
<div id="ladowanie">
  <h1>Ładowanie spaceru…</h1>
  <div id="pasek"><div id="pasek-w"></div></div>
  <div id="procent">0%</div>
</div>
<div id="panorama"></div>
<script src="/static/spacer/pannellum.js"></script>
<script src="/static/spacer/proba.js"></script>
</body>
</html>
