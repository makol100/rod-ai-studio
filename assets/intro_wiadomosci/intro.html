<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  /* INTRO „WIADOMOŚCI Z OGRODU" — wariant C (Belzebub), D-0349.
     Spec: 5 s, 1080x1920, tło kremowe, logo środek, tytuł Fraunces zielony,
     podtytuł atrament, złoty pasek 360->520 px. Stan klatki ustawia
     window.ustawKlatke(t) — zero animacji CSS, pełny determinizm. */
  @font-face {
    font-family: "Fraunces ROD";
    src: url("file:///root/rod-ai-studio/www_rod/static/fonts/fraunces-pl.woff2") format("woff2");
    font-weight: 400 800;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #fffdf6; overflow: hidden; }
  #scena { position: relative; width: 1080px; height: 1920px; font-family: "Fraunces ROD", serif; }
  #logo {
    position: absolute; left: 540px; top: 420px; width: 260px; height: 260px;
    transform: translate(-50%, -50%) scale(0.92); opacity: 0;
  }
  #tytul {
    position: absolute; left: 540px; top: 760px; transform: translate(-50%, -50%);
    width: 1000px; text-align: center; color: #1f5a37; font-size: 96px;
    font-weight: 700; line-height: 1.18; letter-spacing: .02em; opacity: 0;
  }
  #podtytul {
    position: absolute; left: 540px; top: 950px; transform: translate(-50%, -50%);
    width: 1000px; text-align: center; color: #172019; font-size: 34px;
    font-weight: 500; letter-spacing: .04em; opacity: 0;
  }
  #pasek {
    position: absolute; left: 540px; top: 1030px; transform: translate(-50%, -50%);
    width: 0px; height: 8px; background: #e5b744; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="scena">
  <img id="logo" src="file:///root/rod-ai-studio/assets/branding/rod_logo_kolo.png" alt="">
  <div id="tytul">WIADOMOŚCI<br>Z&nbsp;OGRODU</div>
  <div id="podtytul">ROD im. Józefa Lompy w&nbsp;Woźnikach</div>
  <div id="pasek"></div>
</div>
<script>
  function lin(t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); }
  function gladko(x) { return x * x * (3 - 2 * x); } /* smoothstep — łagodny ruch */

  window.ustawKlatke = function (t) {
    /* zamrożenie 4,6–5,0 s: stan jak w 4,6 s */
    if (t > 4.6) t = 4.6;

    /* 1) 0,0–0,8 s: logo — skala 0,92 -> 1,0 + wejście z przezroczystości */
    const pL = gladko(lin(t, 0.0, 0.8));
    const logo = document.getElementById("logo");
    logo.style.opacity = pL;
    logo.style.transform = "translate(-50%,-50%) scale(" + (0.92 + 0.08 * pL) + ")";

    /* 2) 0,8–2,4 s: tytuł — spokojny fade-in */
    document.getElementById("tytul").style.opacity = gladko(lin(t, 0.8, 2.4));

    /* 3) 2,4–3,8 s: podtytuł fade-in; pasek wyjeżdża 0 -> 360 px w 0,4 s */
    document.getElementById("podtytul").style.opacity = gladko(lin(t, 2.4, 3.2));
    const pasek = document.getElementById("pasek");
    let szer = 360 * gladko(lin(t, 2.4, 2.8));
    let jasnosc = 1.0;

    /* 4) 3,8–4,6 s: pasek 360 -> 520 px, przyciemnienie do 80% */
    if (t >= 3.8) {
      const p4 = gladko(lin(t, 3.8, 4.6));
      szer = 360 + 160 * p4;
      jasnosc = 1.0 - 0.2 * p4;
    }
    pasek.style.width = szer + "px";
    pasek.style.filter = "brightness(" + jasnosc + ")";
  };
</script>
</body>
</html>
